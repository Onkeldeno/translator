<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Englisch Übersetzer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
      margin-top: 20px;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }

    textarea {
      width: 100%;
      min-height: 300px;
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      font-family: inherit;
      resize: vertical;
      transition: border-color 0.2s;
    }

    textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .hint {
      margin-top: 12px;
      font-size: 13px;
      color: #666;
      text-align: center;
    }

    /* Translation Popup */
    .popup {
      position: fixed;
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      z-index: 9999;
      min-width: 250px;
      max-width: 300px;
      padding: 0;
      animation: popupIn 0.2s ease-out;
    }

    @keyframes popupIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .popup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #e0e0e0;
    }

    .popup-header strong {
      font-size: 14px;
      color: #333;
      word-break: break-word;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #999;
      padding: 0;
      width: 24px;
      height: 24px;
    }

    .close-btn:hover {
      color: #333;
    }

    .popup-translation {
      padding: 12px;
      font-size: 14px;
      color: #666;
      background: #f9f9f9;
      line-height: 1.5;
    }

    .message {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: #4CAF50;
      color: white;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      animation: slideUp 0.3s ease-out;
      z-index: 10000;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      header h1 {
        font-size: 24px;
      }

      .card {
        padding: 20px;
      }

      textarea {
        min-height: 250px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📚 Englisch Übersetzer</h1>
      <p>Doppelklick auf ein englisches Wort zum Übersetzen</p>
    </header>

    <div class="card">
      <textarea
        id="textArea"
        placeholder="Kopiere englischen Text hier rein oder tippe etwas ein..."
      ></textarea>
      <div class="hint">💡 Doppelklick auf ein englisches Wort für die deutsche Übersetzung</div>
    </div>
  </div>

  <script>
    const textArea = document.getElementById('textArea');

    textArea.addEventListener('dblclick', (event) => {
      const selectedText = window.getSelection().toString().trim();

      if (!selectedText || selectedText.length < 2) {
        return;
      }

      const word = selectedText.split(/\s+/)[0];

      const rect = event.target.getBoundingClientRect();
      const x = event.clientX || rect.left;
      const y = event.clientY || rect.top;

      translateWord(word, x, y);
    });

    async function translateWord(word, x, y) {
      try {
        const response = await fetch(
          `https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|de`
        );
        const data = await response.json();
        const translation = data.responseData.translatedText;

        showPopup(word, translation, x, y);
      } catch (error) {
        showMessage('Fehler beim Übersetzen');
      }
    }

    function showPopup(word, translation, x, y) {
      // Entferne altes Popup
      const oldPopup = document.querySelector('.popup');
      if (oldPopup) {
        oldPopup.remove();
      }

      // Erstelle neues Popup
      const popup = document.createElement('div');
      popup.className = 'popup';
      popup.innerHTML = `
        <div class="popup-header">
          <strong>${word}</strong>
          <button class="close-btn">×</button>
        </div>
        <div class="popup-translation">${translation}</div>
      `;

      document.body.appendChild(popup);

      // Position berechnen
      let popupX = x;
      let popupY = y + 20;

      if (popupX + 300 > window.innerWidth) {
        popupX = window.innerWidth - 310;
      }
      if (popupX < 10) {
        popupX = 10;
      }

      popup.style.left = popupX + 'px';
      popup.style.top = popupY + 'px';

      // Close Button
      popup.querySelector('.close-btn').addEventListener('click', () => {
        popup.remove();
      });

      // Auto-close nach 5 Sekunden
      setTimeout(() => {
        if (document.body.contains(popup)) {
          popup.remove();
        }
      }, 5000);

      // Close beim Klick außerhalb
      document.addEventListener('click', (e) => {
        if (!popup.contains(e.target) && document.body.contains(popup)) {
          popup.remove();
        }
      }, { once: true });
    }

    function showMessage(text) {
      const msg = document.createElement('div');
      msg.className = 'message';
      msg.textContent = text;
      document.body.appendChild(msg);

      setTimeout(() => msg.remove(), 2000);
    }
  </script>
</body>
</html>
